[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "converter-studio"
dynamic = ["version"]
description = "Official Python client and command-line tool for the Converter Studio API: convert HEIC, RAW, video, audio, documents and e-books from Python."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Converter Studio", email = "support@converter.studio" }]
keywords = [
  "converter-studio",
  "file-conversion",
  "converter",
  "heic-to-jpg",
  "video-converter",
  "pdf",
  "api-client",
  "sdk",
  "cli",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
  "Topic :: Multimedia :: Sound/Audio :: Conversion",
  "Topic :: Multimedia :: Video :: Conversion",
  "Topic :: Office/Business",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1", "anyio>=4"]

[project.urls]
Homepage = "https://converter.studio"
Documentation = "https://converter.studio/developers"
Source = "https://github.com/tariksucu/converter-studio-python"
Issues = "https://github.com/tariksucu/converter-studio-python/issues"
Changelog = "https://github.com/tariksucu/converter-studio-python/blob/main/CHANGELOG.md"

[project.scripts]
converter-studio = "converter_studio._cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "trio>=0.27", "mypy>=1.13", "ruff>=0.8", "build>=1.2", "twine>=6.1"]

[tool.hatch.version]
path = "src/converter_studio/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/converter_studio"]

[tool.hatch.build.targets.sdist]
include = [
  "src/converter_studio",
  "tests",
  "README.md",
  "CHANGELOG.md",
  "LICENSE",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PT", "RET", "S", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
